<text x="886" y="815" class="l">(+ npm ci / tests)</text>
<text x="886" y="836" class="l">rescan, before vs after</text>
<text x="886" y="857" class="l">Planner agent: next fix</text>
<text x="886" y="878" class="l b">verified · partial · failed</text>
<rect x="1180" y="736" width="270" height="212" rx="12" fill="#f4f5f7" stroke="#5b6876" stroke-width="2" stroke-dasharray="6 4"/>
