<rect x="50" y="424" width="290" height="230" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
<text x="66" y="454" class="t" fill="#1f4e9c">3 · SYMBOLIC PRIOR</text>
<text x="66" y="482" class="l">reachability: imported?</text>
<text x="66" y="503" class="l">EPSS + CISA KEV</text>
<text x="66" y="524" class="l">business: SSVC rules</text>
<text x="66" y="545" class="l">  (business_rules.json)</text>
<text x="66" y="566" class="l">CVSS · dev-only · direct</text>
<text x="66" y="587" class="l b">→ P1–P4 prior</text>
<rect x="370" y="424" width="540" height="230" rx="12" fill="#f1eafa" stroke="#6b3fa0" stroke-width="2"/>
<text x="386" y="454" class="t" fill="#6b3fa0">SIX AGENTS · shared case file</text>
<text x="896" y="452" class="tag" text-anchor="end" fill="#6b3fa0">AI agent</text>
<text x="386" y="482" class="l b">6 Business Context: internet-facing? sensitive data? (file:line)</text>
<text x="386" y="503" class="l b">1 Orchestrator &amp; Triage (lead): routes cases, final priority</text>
<text x="386" y="524" class="l b">2 Vulnerability Analyst: is the CVE exploitable in this app?</text>
<text x="386" y="545" class="l b">3 Supply-Chain Forensics: fakes · scripts · tampering · CI</text>
<text x="386" y="566" class="l b">4 Remediation Planner · 5 Critic (second opinion)</text>
<text x="386" y="587" class="l">read-only tools · ≤5 steps · Claude → Gemini → Groq → rules</text>
<rect x="940" y="424" width="270" height="230" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
