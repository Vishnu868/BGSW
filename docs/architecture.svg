<text x="66" y="276" class="l">generated with</text>
<text x="66" y="297" class="l">--ignore-scripts</text>
<text x="66" y="318" class="l">(no package code runs)</text>
<rect x="290" y="134" width="360" height="210" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
<text x="306" y="164" class="t" fill="#1f4e9c">1 · DISCOVER</text>
<text x="636" y="162" class="tag" text-anchor="end" fill="#1f4e9c">deterministic engine</text>
<text x="306" y="192" class="l">find manifests · lockfiles ·</text>
<text x="306" y="213" class="l">Dockerfiles · CI workflows</text>
<text x="306" y="234" class="l">adapters: npm lockfile v1–v3 ·</text>
<text x="306" y="255" class="l">Python · Maven · Go · Ruby · PHP · C#</text>
<text x="306" y="276" class="l">deps.dev fills lockfile-less trees</text>
<text x="306" y="297" class="l b">→ dependency graph + paths</text>
<rect x="690" y="134" width="420" height="210" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
<text x="706" y="164" class="t" fill="#1f4e9c">2 · DETECT</text>
<text x="1096" y="162" class="tag" text-anchor="end" fill="#1f4e9c">deterministic engine</text>
<text x="706" y="192" class="l">osv.py        1.1/1.2 CVEs · CVSS · fixed version</text>
<text x="706" y="213" class="l">scanners.py   Trivy + Grype cross-check (N of M)</text>
<text x="706" y="234" class="l">packages.py   1.3 typosquat · 1.4 install scripts</text>
<text x="706" y="255" class="l">lockfile.py   1.6 tamper · registry · diff</text>
<text x="706" y="276" class="l">container.py 1.5 images · cicd.py 1.7 actions</text>
<text x="706" y="297" class="l b">every finding carries evidence</text>
<rect x="1150" y="134" width="300" height="210" rx="12" fill="#f4f5f7" stroke="#5b6876" stroke-width="2" stroke-dasharray="6 4"/>
