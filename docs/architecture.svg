<text x="1000" y="399" class="al">verdicts</text>
<rect x="30" y="696" width="1440" height="266" rx="16" fill="#fafbfd" stroke="#d5dbe3"/>
<text x="50" y="720" class="bt">DAY 2 · SHIELD</text>
<text x="290" y="720" class="bs">plan → approve → apply → validate → report   (nothing changes without a human yes)</text>
<rect x="50" y="736" width="240" height="212" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
<text x="66" y="766" class="t" fill="#1f4e9c">4 · PLAN</text>
<text x="66" y="794" class="l">9 allow-listed actions:</text>
<text x="66" y="815" class="l">upgrade · override ·</text>
<text x="66" y="836" class="l">replace · pin digest/SHA</text>
<text x="66" y="857" class="l">· block · escalate</text>
<text x="66" y="878" class="l">+ compat · rollback</text>
<text x="66" y="899" class="l b">plan = SHA-256 hash</text>
<rect x="320" y="736" width="230" height="212" rx="12" fill="#fdf0e4" stroke="#c2580a" stroke-width="2"/>
<text x="336" y="766" class="t" fill="#c2580a">5 · APPROVE</text>
<text x="336" y="794" class="l">terminal or web page</text>
<text x="336" y="815" class="l">approval bound to</text>
<text x="336" y="836" class="l">the plan hash</text>
<text x="336" y="857" class="l">plan edited → void</text>
<text x="336" y="878" class="l b">no yes → no change</text>
<rect x="580" y="736" width="260" height="212" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
<text x="596" y="766" class="t" fill="#1f4e9c">6 · APPLY (sandbox)</text>
<text x="596" y="794" class="l">copy + git branch</text>
<text x="596" y="815" class="l">edit package.json /</text>
<text x="596" y="836" class="l">FROM / uses: lines</text>
<text x="596" y="857" class="l">lockfiles --ignore-scripts</text>
<text x="596" y="878" class="l">kill switch: STOP file</text>
<text x="596" y="899" class="l b">→ remediation.patch</text>
<rect x="870" y="736" width="280" height="212" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
<text x="886" y="766" class="t" fill="#1f4e9c">7 · VALIDATE</text>
<text x="886" y="794" class="l">lockfile resolve</text>
<text x="886" y="815" class="l">(+ npm ci / tests)</text>
<text x="886" y="836" class="l">rescan with DISCOVER+DETECT</text>
<text x="886" y="857" class="l">before vs after, new risks?</text>
<text x="886" y="878" class="l b">verified · partial · failed</text>
<rect x="1180" y="736" width="270" height="212" rx="12" fill="#f4f5f7" stroke="#5b6876" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1196" y="766" class="t" fill="#5b6876">REPORT + POLICY</text>
<text x="1196" y="794" class="l b">guardian_report.html</text>
<text x="1196" y="815" class="l">finding → evidence → AI →</text>
<text x="1196" y="836" class="l">approval → result →</text>
<text x="1196" y="857" class="l">remaining risk</text>
<text x="1196" y="878" class="l">policy.json gate</text>
<text x="1196" y="899" class="l">(exit 1 blocks CI)</text>
