<text x="336" y="794" class="l">business facts + review</text>
<text x="336" y="815" class="l">queue (optional)</text>
<text x="336" y="836" class="l">approval bound to</text>
<text x="336" y="857" class="l">the plan hash</text>
<text x="336" y="878" class="l b">no yes → no change</text>
<rect x="580" y="736" width="260" height="212" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
<text x="596" y="766" class="t" fill="#1f4e9c">6 · APPLY (sandbox)</text>
<text x="596" y="794" class="l">copy + git branch</text>
<text x="596" y="815" class="l">edit package.json /</text>
<text x="596" y="836" class="l">FROM / uses: lines</text>
<text x="596" y="857" class="l">lockfiles --ignore-scripts</text>
<text x="596" y="878" class="l">kill switch: STOP file</text>
<text x="596" y="899" class="l b">→ remediation.patch</text>
<rect x="870" y="736" width="280" height="212" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
