<text x="50" y="720" class="bt">DAY 2 · SHIELD</text>
<text x="290" y="720" class="bs">plan → approve → apply → validate → report   (nothing changes without a human yes)</text>
<rect x="50" y="736" width="240" height="212" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
<text x="66" y="766" class="t" fill="#1f4e9c">4 · PLAN</text>
<text x="66" y="794" class="l">rule proposal →</text>
<text x="66" y="815" class="l">Planner agent →</text>
<text x="66" y="836" class="l">verifier → Critic</text>
<text x="66" y="857" class="l">9 allow-listed actions</text>
<text x="66" y="878" class="l">fix&#x27;s own tree checked</text>
<text x="66" y="899" class="l b">plan = SHA-256 hash</text>
<rect x="320" y="736" width="230" height="212" rx="12" fill="#fdf0e4" stroke="#c2580a" stroke-width="2"/>
