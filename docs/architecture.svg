<text x="956" y="482" class="l">facts: graph · OSV ·</text>
<text x="956" y="503" class="l">registry · deps.dev</text>
<text x="956" y="524" class="l">rules: allow-list · semver</text>
<text x="956" y="545" class="l">· version exists · ±20</text>
<text x="956" y="566" class="l b">no cited evidence → reject</text>
<text x="956" y="587" class="l b">conf &lt; 0.6 → human review</text>
