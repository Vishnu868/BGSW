<rect width="1800" height="1060" fill="#ffffff"/>
<text x="30" y="44" class="h">Software Supply Chain Guardian — architecture</text>
<rect x="30" y="62" width="22" height="16" rx="4" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
<text x="60" y="75" class="lg">deterministic engine</text>
<rect x="250" y="62" width="22" height="16" rx="4" fill="#f1eafa" stroke="#6b3fa0" stroke-width="2"/>
<text x="280" y="75" class="lg">AI agent</text>
<rect x="374" y="62" width="22" height="16" rx="4" fill="#fdf0e4" stroke="#c2580a" stroke-width="2"/>
<text x="404" y="75" class="lg">human decision</text>
<rect x="546" y="62" width="22" height="16" rx="4" fill="#f4f5f7" stroke="#5b6876" stroke-width="2"/>
<text x="576" y="75" class="lg">data / output</text>
<rect x="710" y="62" width="22" height="16" rx="4" fill="#e9f6ee" stroke="#1f7a3a" stroke-width="2"/>
<text x="740" y="75" class="lg">external public data</text>
<rect x="30" y="96" width="1440" height="262" rx="16" fill="#fafbfd" stroke="#d5dbe3"/>
<text x="50" y="120" class="bt">DAY 1 · EYES</text>
<text x="290" y="120" class="bs">python -m guardian scan &lt;repo&gt;  →  what is in the app, what changed, what is risky</text>
<rect x="50" y="134" width="200" height="210" rx="12" fill="#f4f5f7" stroke="#5b6876" stroke-width="2" stroke-dasharray="6 4"/>
<text x="66" y="164" class="t" fill="#5b6876">Any repository</text>
<text x="66" y="192" class="l">local folder or git URL</text>
<text x="66" y="213" class="l">read-only clone</text>
<text x="66" y="234" class="l"></text>
<text x="66" y="255" class="l">missing npm lockfile?</text>
<text x="66" y="276" class="l">generated with</text>
<text x="66" y="297" class="l">--ignore-scripts</text>
<text x="66" y="318" class="l">(no package code runs)</text>
<rect x="290" y="134" width="360" height="210" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
<text x="306" y="164" class="t" fill="#1f4e9c">1 · DISCOVER</text>
<text x="636" y="162" class="tag" text-anchor="end" fill="#1f4e9c">deterministic engine</text>
<text x="306" y="192" class="l">find manifests · lockfiles ·</text>
<text x="306" y="213" class="l">Dockerfiles · CI workflows</text>
<text x="306" y="234" class="l">adapters: npm lockfile v1–v3 ·</text>
<text x="306" y="255" class="l">Python · Maven · Go · CycloneDX</text>
<text x="306" y="276" class="l">deps.dev fills lockfile-less trees</text>
<text x="306" y="297" class="l b">→ dependency graph + paths</text>
<rect x="690" y="134" width="420" height="210" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
<text x="706" y="164" class="t" fill="#1f4e9c">2 · DETECT</text>
<text x="1096" y="162" class="tag" text-anchor="end" fill="#1f4e9c">deterministic engine</text>
<text x="706" y="192" class="l">osv.py        1.1/1.2 CVEs · CVSS · fixed version</text>
<text x="706" y="213" class="l">packages.py   1.3 typosquat · 1.4 install scripts</text>
<text x="706" y="234" class="l">lockfile.py   1.6 tamper · registry · diff</text>
<text x="706" y="255" class="l">container.py  1.5 digest pin · EOL · root</text>
<text x="706" y="276" class="l">cicd.py       1.7 unpinned actions · injection</text>
<text x="706" y="297" class="l b">every finding carries evidence</text>
<rect x="1150" y="134" width="300" height="210" rx="12" fill="#f4f5f7" stroke="#5b6876" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1166" y="164" class="t" fill="#5b6876">Day 1 outputs</text>
<text x="1166" y="192" class="l b">guardian.html</text>
<text x="1166" y="213" class="l">interactive dependency graph</text>
<text x="1166" y="234" class="l">findings.json  (evidence)</text>
<text x="1166" y="255" class="l">sbom.cdx.json  (CycloneDX 1.5,</text>
<text x="1166" y="276" class="l">  next scan&#x27;s baseline)</text>
<text x="1166" y="297" class="l">report.md</text>
<path d="M250 239 L286 239" fill="none" stroke="#3d4a5c" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M650 239 L686 239" fill="none" stroke="#3d4a5c" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M1110 239 L1146 239" fill="none" stroke="#3d4a5c" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="30" y="384" width="1440" height="286" rx="16" fill="#fafbfd" stroke="#d5dbe3"/>
<text x="50" y="408" class="bt">DAY 2 · BRAIN</text>
<text x="290" y="408" class="bs">python -m guardian analyze &lt;repo&gt;  →  what matters most, and why</text>
<rect x="50" y="424" width="360" height="230" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
<text x="66" y="454" class="t" fill="#1f4e9c">3 · ANALYZE: context</text>
<text x="396" y="452" class="tag" text-anchor="end" fill="#1f4e9c">deterministic engine</text>
<text x="66" y="482" class="l">reachability.py  imported? file:line</text>
<text x="66" y="503" class="l">intel.py  EPSS + CISA KEV</text>
<text x="66" y="524" class="l">prioritize.py  explainable score:</text>
<text x="66" y="545" class="l">  CVSS · exploitation · dev-only ·</text>
<text x="66" y="566" class="l">  reachability · directness</text>
<text x="66" y="587" class="l b">→ P1 · P2 · P3 · P4 risk items</text>
<rect x="450" y="424" width="460" height="230" rx="12" fill="#f1eafa" stroke="#6b3fa0" stroke-width="2"/>
<text x="466" y="454" class="t" fill="#6b3fa0">AI INVESTIGATOR (one per top risk)</text>
<text x="896" y="452" class="tag" text-anchor="end" fill="#6b3fa0">AI agent</text>
<text x="466" y="482" class="l">picks read-only tools one at a time (≤5 steps):</text>
<text x="466" y="503" class="l">item_details · dependency_paths · code_usage ·</text>
<text x="466" y="524" class="l">advisory · exploit_intel · registry_info ·</text>
<text x="466" y="545" class="l">registry_versions · baseline_change → E1..En</text>
<text x="466" y="566" class="l b">evidence checker: cite real evidence ids,</text>
<text x="466" y="587" class="l b">versions must exist, CVEs must be in evidence,</text>
<text x="466" y="608" class="l b">confidence &lt; 0.6 → human review</text>
<rect x="950" y="424" width="250" height="230" rx="12" fill="#e8f0fc" stroke="#1f4e9c" stroke-width="2"/>
<text x="966" y="454" class="t" fill="#1f4e9c">LLM ROUTER</text>
<text x="966" y="482" class="l">Claude  (Anthropic SDK)</text>
<text x="966" y="503" class="l">   ↓ on failure</text>
<text x="966" y="524" class="l">Gemini  (REST)</text>
<text x="966" y="545" class="l">   ↓</text>
<text x="966" y="566" class="l">Groq  (REST)</text>
<text x="966" y="587" class="l">   ↓</text>
<text x="966" y="608" class="l b">rule-based logic (no key)</text>
<rect x="1240" y="424" width="210" height="230" rx="12" fill="#f4f5f7" stroke="#5b6876" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1256" y="454" class="t" fill="#5b6876">analysis.json</text>
<text x="1256" y="482" class="l">prioritised risks</text>
<text x="1256" y="503" class="l">verdicts labelled</text>
<text x="1256" y="524" class="l">AI or rules</text>
<text x="1256" y="545" class="l">(inference, separate</text>
<text x="1256" y="566" class="l">from evidence)</text>
<text x="1256" y="587" class="l">executive summary</text>
